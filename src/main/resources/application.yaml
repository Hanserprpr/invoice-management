spring:
  application:
    name: invoice-management
  session:
    store-type: none
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/invoice_management?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    # 反向代理带路径前缀时（如 https://i.sdu.edu.cn/invoice），用 API_DOCS_EXTERNAL_PREFIX=/invoice
    # 告诉页面到外部路径去取文档；默认为空，本地直连不受影响
    url: ${API_DOCS_EXTERNAL_PREFIX:}/v3/api-docs
    config-url: ${API_DOCS_EXTERNAL_PREFIX:}/v3/api-docs/swagger-config
    oauth2-redirect-url: ${API_DOCS_OAUTH2_REDIRECT_URL:${API_DOCS_EXTERNAL_PREFIX:}/swagger-ui/oauth2-redirect.html}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    csrf:
      enabled: true
  default-produces-media-type: application/json

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:10s}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        secure: ${SESSION_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

app:
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:5m}
    processing-ttl: ${IDEMPOTENCY_PROCESSING_TTL:5m}
    request-timeout: ${IDEMPOTENCY_REQUEST_TIMEOUT:60s}
    cleanup-interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:1h}
    cleanup-batch-size: ${IDEMPOTENCY_CLEANUP_BATCH_SIZE:1000}
    max-request-bytes: ${IDEMPOTENCY_MAX_REQUEST_BYTES:2097152}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    requests: ${RATE_LIMIT_REQUESTS:60}
    window: ${RATE_LIMIT_WINDOW:1m}
  export:
    worker-enabled: ${EXPORT_WORKER_ENABLED:${R2_ENABLED:false}}
    poll-interval: ${EXPORT_POLL_INTERVAL:5s}
  notification:
    worker-enabled: ${NOTIFICATION_WORKER_ENABLED:false}
    poll-interval: ${NOTIFICATION_POLL_INTERVAL:5s}
    delivery:
      enabled: ${NOTIFICATION_DELIVERY_ENABLED:false}
      endpoint: ${NOTIFICATION_DELIVERY_ENDPOINT:}
      api-key: ${NOTIFICATION_DELIVERY_API_KEY:}
      timeout: ${NOTIFICATION_DELIVERY_TIMEOUT:10s}
  recognition:
    worker-enabled: ${OCR_WORKER_ENABLED:${R2_ENABLED:false}}
    poll-interval: ${OCR_POLL_INTERVAL:5s}
    ocr:
      enabled: ${OCR_ENABLED:false}
      endpoint: ${OCR_ENDPOINT:}
      api-key: ${OCR_API_KEY:}
      timeout: ${OCR_TIMEOUT:30s}
  file-scan:
    worker-enabled: ${FILE_SCAN_WORKER_ENABLED:${R2_ENABLED:false}}
    poll-interval: ${FILE_SCAN_POLL_INTERVAL:5s}
    clamav:
      enabled: ${CLAMAV_ENABLED:false}
      host: ${CLAMAV_HOST:127.0.0.1}
      port: ${CLAMAV_PORT:3310}
      connect-timeout: ${CLAMAV_CONNECT_TIMEOUT:3s}
      read-timeout: ${CLAMAV_READ_TIMEOUT:2m}
  file-cleanup:
    enabled: ${FILE_CLEANUP_ENABLED:${R2_ENABLED:false}}
    interval: ${FILE_CLEANUP_INTERVAL:1h}
  storage:
    r2:
      enabled: ${R2_ENABLED:false}
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      upload-url-ttl: ${R2_UPLOAD_URL_TTL:10m}
      download-url-ttl: ${R2_DOWNLOAD_URL_TTL:5m}
      request-timeout: ${R2_REQUEST_TIMEOUT:30s}
      attempt-timeout: ${R2_ATTEMPT_TIMEOUT:10s}
  bootstrap:
    platform-admin:
      cas-id: ${APP_BOOTSTRAP_PLATFORM_ADMIN_CAS_ID:}
      name: ${APP_BOOTSTRAP_PLATFORM_ADMIN_NAME:}
  security:
    cors:
      # 逗号分隔；凭据型 CORS 必须列出明确 Origin，不能使用 *。
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5715}
    oidc:
      client-id: ${SDU_OIDC_CLIENT_ID}
      client-secret: ${SDU_OIDC_CLIENT_SECRET}
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      success-url: ${OIDC_LOGIN_SUCCESS_URL:/auth/login/success}
